name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build the release from
        required: true

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read the tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v', 'V')

          "tag=$tag"         | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $stated = ($props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ }) -as [string]

          if ($stated -ne '${{ steps.tag.outputs.version }}') {
            throw "Tag says ${{ steps.tag.outputs.version }}, Directory.Build.props says $stated"
          }

      - name: Restore
        run: dotnet restore Nulltrap.slnx

      - name: Build
        run: dotnet build Nulltrap.slnx -c Release --no-restore -warnaserror

      - name: Publish
        run: dotnet publish src/Nulltrap.App -c Release -o publish

      - name: Hash the artifacts
        shell: pwsh
        run: |
          $built = @(Get-ChildItem publish -File | Sort-Object Name)

          foreach ($file in $built) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File publish/SHA256SUMS.txt -Append -Encoding utf8
          }

          Get-Content publish/SHA256SUMS.txt

      - name: Write the release notes
        shell: pwsh
        run: |
          $book = Get-Content src/Nulltrap.Core/Localization/changelog.json -Raw | ConvertFrom-Json
          $entry = $book | Where-Object { $_.version -eq '${{ steps.tag.outputs.version }}' } | Select-Object -First 1

          if (-not $entry) {
            throw "changelog.json has no entry for ${{ steps.tag.outputs.version }}"
          }

          $sums = (Get-Content publish/SHA256SUMS.txt) -join "`n"
          $lines = @()
          $lines += '## What it does'
          $lines += ''
          foreach ($item in $entry.en) { $lines += "- $item" }
          $lines += ''
          $lines += '## Next'
          $lines += ''
          foreach ($item in $entry.nextEn) { $lines += "- $item" }
          $lines += ''
          $lines += '## Install'
          $lines += ''
          $lines += 'Download `Nulltrap.exe` and run it. Nothing has to be installed first and it never asks for administrator rights.'
          $lines += ''
          $lines += '<details><summary>По-русски</summary>'
          $lines += ''
          $lines += '### Что умеет'
          $lines += ''
          foreach ($item in $entry.ru) { $lines += "- $item" }
          $lines += ''
          $lines += '### Дальше'
          $lines += ''
          foreach ($item in $entry.nextRu) { $lines += "- $item" }
          $lines += ''
          $lines += '### Установка'
          $lines += ''
          $lines += 'Скачайте `Nulltrap.exe` и запустите. Ставить заранее ничего не нужно, прав администратора он не просит.'
          $lines += ''
          $lines += '</details>'
          $lines += ''
          $lines += '## SHA-256'
          $lines += ''
          $lines += '```'
          $lines += $sums
          $lines += '```'

          $lines -join "`n" | Out-File notes.md -Encoding utf8

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ steps.tag.outputs.tag }}' `
            --draft `
            --title 'Nulltrap ${{ steps.tag.outputs.version }}' `
            --notes-file notes.md `
            (Get-ChildItem publish -File | ForEach-Object { $_.FullName })
