<svg xmlns="http://www.w3.org/2000/svg" width="900" height="228" viewBox="0 0 900 228" role="img" aria-label="Nulltrap roadmap: phases 0 and 1 done, phase 2 in progress, phases 3 and 4 planned">
  <defs>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="90" y1="104" x2="450" y2="104">
      <stop offset="0%" stop-color="#7B2FC7"/>
      <stop offset="100%" stop-color="#B96FF0"/>
    </linearGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="228" rx="10" fill="#0F0C15"/>
  <rect x="0.5" y="0.5" width="899" height="227" rx="10" fill="none" stroke="#2E2640"/>

  <text x="40" y="42" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EDE9F2">Nulltrap</text>
  <text x="122" y="42" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#938BA6">alternative Roblox bootstrapper for Windows</text>

  <g transform="translate(752,28)">
    <rect width="108" height="22" rx="11" fill="#1B1626" stroke="#62209F"/>
    <circle cx="15" cy="11" r="4" fill="#B96FF0">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="15" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#EDE9F2">in progress</text>
  </g>

  <line x1="90" y1="104" x2="810" y2="104" stroke="#2E2640" stroke-width="3" stroke-linecap="round"/>

  <line x1="90" y1="104" x2="90" y2="104" stroke="url(#track)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x2" from="90" to="450" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
  </line>

  <g font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" text-anchor="middle">

    <g transform="translate(90,104)">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.3" to="1" dur="0.45s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.34 1.4 0.64 1" keyTimes="0;1"/>
        <circle r="11" fill="#7B2FC7"/>
        <path d="M -4 0 L -1.2 3 L 4.2 -3" fill="none" stroke="#0F0C15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text y="40" font-size="12" font-weight="600" fill="#EDE9F2">Phase 0</text>
      <text y="58" font-size="11" fill="#938BA6">Foundation</text>
      <text y="76" font-size="10" fill="#B96FF0">done</text>
    </g>

    <g transform="translate(270,104)">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.3" to="1" dur="0.45s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.34 1.4 0.64 1" keyTimes="0;1"/>
        <circle r="11" fill="#9748DE"/>
        <path d="M -4 0 L -1.2 3 L 4.2 -3" fill="none" stroke="#0F0C15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text y="40" font-size="12" font-weight="600" fill="#EDE9F2">Phase 1</text>
      <text y="58" font-size="11" fill="#938BA6">Download &amp; launch</text>
      <text y="76" font-size="10" fill="#B96FF0">done</text>
    </g>

    <g transform="translate(450,104)">
      <circle r="11" fill="none" stroke="#B96FF0" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="11;22" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.3" to="1" dur="0.45s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.34 1.4 0.64 1" keyTimes="0;1"/>
        <circle r="10" fill="#0F0C15" stroke="#B96FF0" stroke-width="3" filter="url(#halo)"/>
        <circle r="4" fill="#E4BAFC">
          <animate attributeName="r" values="4;2.5;4" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text y="40" font-size="12" font-weight="600" fill="#EDE9F2">Phase 2</text>
      <text y="58" font-size="11" fill="#938BA6">Mods &amp; session</text>
      <text y="76" font-size="10" fill="#E4BAFC">in progress</text>
    </g>

    <g transform="translate(630,104)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
      <circle r="9" fill="#0F0C15" stroke="#2E2640" stroke-width="2.5"/>
      <text y="40" font-size="12" font-weight="600" fill="#938BA6">Phase 3</text>
      <text y="58" font-size="11" fill="#6B6480">Profiles &amp; plugins</text>
      <text y="76" font-size="10" fill="#6B6480">planned</text>
    </g>

    <g transform="translate(810,104)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
      <circle r="9" fill="#0F0C15" stroke="#2E2640" stroke-width="2.5"/>
      <text y="40" font-size="12" font-weight="600" fill="#938BA6">Phase 4</text>
      <text y="58" font-size="11" fill="#6B6480">Second platform</text>
      <text y="76" font-size="10" fill="#6B6480">open</text>
    </g>

  </g>
</svg>
